<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BIYE — Log In | বিয়ে</title>
<meta name="description" content="Log in to BIYE — the science of marriage, trust for life.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ======================================================================
   BIYE — login.html
   Same visual language as register.html:
   LEFT = solid vivid pink · RIGHT = solid vivid yellow · NO gradients.
   Functional colours: RED=action, GREEN=verified/success,
   BLUE=information, PINK=brand accent.
   ====================================================================== */
:root{
  --pink:#FF1E7E;
  --yellow:#FFD400;
  --red:#E11D2E;
  --red-dark:#B8121F;
  --green:#0FA958;
  --green-dark:#0B7F43;
  --blue:#1256D6;
  --blue-dark:#0C3FA0;
  --ink:#161616;
  --ink-soft:rgba(22,22,22,.62);
  --ink-faint:rgba(22,22,22,.42);
  --line:rgba(22,22,22,.12);
  --line-soft:rgba(22,22,22,.08);
  --card:#FFFFFF;
  --page-bg:#FBFAF7;
  --radius:20px;
  --shadow-card:0 24px 60px -20px rgba(22,22,22,.32), 0 4px 14px -6px rgba(22,22,22,.12);
  --focus:0 0 0 3px rgba(18,86,214,.28);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Hind Siliguri','Inter',sans-serif;
  color:var(--ink);
  background:var(--page-bg);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
html[lang="en"] body{font-family:'Inter','Hind Siliguri',sans-serif}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.skip-link{position:absolute;left:-999px;top:0;background:#fff;color:var(--ink);padding:.7rem 1rem;border-radius:0 0 10px 0;z-index:999;font-weight:700}
.skip-link:focus{left:0}

/* ---------------- Split background ---------------- */
.split-bg{position:fixed;inset:0;z-index:0;display:flex}
.split-bg .half{flex:1}
.split-bg .half.pink{background:var(--pink)}
.split-bg .half.yellow{background:var(--yellow)}

/* ---------------- Header ---------------- */
.site-header{
  position:sticky;top:0;z-index:50;
  background:var(--red);color:#fff;
  box-shadow:0 3px 14px -6px rgba(0,0,0,.35);
}
.header-inner{
  max-width:1180px;margin:0 auto;padding:.75rem 1.1rem;
  display:flex;align-items:center;justify-content:space-between;gap:.8rem;
}
.brand{display:flex;align-items:center;gap:.55rem;text-decoration:none;color:#fff}
.brand-mark{
  width:34px;height:34px;border-radius:9px;background:#fff;color:var(--red);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.05rem;
  font-family:'Inter',sans-serif;flex-shrink:0;
}
.brand-word{font-family:'Inter',sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:.01em}
.brand-word small{display:block;font-weight:500;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;opacity:.88}
.header-actions{display:flex;align-items:center;gap:.4rem}
.hbtn{
  background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.5);color:#fff;
  font-size:.74rem;font-weight:700;padding:.42rem .7rem;border-radius:50px;
  display:flex;align-items:center;gap:.35rem;white-space:nowrap;
}
.hbtn:hover{background:rgba(255,255,255,.24)}
.hbtn svg{width:14px;height:14px;stroke:#fff;flex-shrink:0}
.hbtn.icon-only{padding:.42rem;width:34px;height:34px;justify-content:center}
@media (max-width:640px){
  .hbtn .btn-label{display:none}
  .brand-word small{display:none}
}

/* ---------------- Layout / floating card ---------------- */
.stage{position:relative;z-index:1;min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;padding:2.4rem 1rem 3.5rem}
.card-wrap{width:100%;max-width:440px}
.login-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-card);
  padding:1.9rem 1.7rem 1.6rem;position:relative;
  border-top:6px solid var(--red);
}
@media (max-width:480px){ .login-card{padding:1.4rem 1.1rem 1.3rem;border-radius:16px} }

.login-badge{
  width:52px;height:52px;border-radius:14px;background:var(--pink);display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;margin-bottom:.9rem;box-shadow:0 8px 18px -8px rgba(0,0,0,.35);
}
.login-title{font-size:1.28rem;font-weight:800;margin-bottom:.3rem;line-height:1.3}
.login-sub{font-size:.85rem;color:var(--ink-soft);line-height:1.6;margin-bottom:1.3rem}

/* fields (same tokens as register.html) */
.field-row{margin-bottom:1.1rem}
.field-label{font-size:.78rem;font-weight:700;color:var(--ink);margin-bottom:.4rem;display:flex;align-items:center;justify-content:space-between}
.field-input{
  width:100%;padding:.8rem .9rem;border-radius:12px;border:1.6px solid var(--line);
  font-size:.95rem;color:var(--ink);outline:none;background:#fff;
}
.field-input:focus{border-color:var(--blue);box-shadow:var(--focus)}
.field-input.err{border-color:var(--red)}
.field-err{font-size:.72rem;color:var(--red);margin-top:.35rem;font-weight:600;display:none}
.field-err.show{display:block}
.pw-wrap{position:relative}
.pw-toggle{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);background:none;border:none;padding:.3rem;color:var(--ink-faint)}
.pw-toggle svg{width:18px;height:18px;stroke:currentColor}
.forgot-link{font-size:.72rem;font-weight:700;color:var(--blue);text-decoration:underline;background:none;border:none;cursor:pointer}

.remember-row{display:flex;align-items:center;gap:.5rem;margin-bottom:1.2rem}
.remember-row input{width:18px;height:18px;accent-color:var(--red)}
.remember-row label{font-size:.8rem;color:var(--ink-soft)}

/* buttons */
.btn{width:100%;padding:.9rem .6rem;border-radius:14px;font-size:.92rem;font-weight:800;text-align:center;border:none}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 10px 20px -10px rgba(225,29,46,.55)}
.btn-primary:disabled{opacity:.5;pointer-events:none}
.btn-primary .spinner{display:inline-block;width:15px;height:15px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:.4rem}
@keyframes spin{to{transform:rotate(360deg)}}

.divider{display:flex;align-items:center;gap:.7rem;margin:1.3rem 0;color:var(--ink-faint);font-size:.72rem;font-weight:700}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

.alt-row{text-align:center;font-size:.84rem;color:var(--ink-soft)}
.alt-row a{color:var(--red);font-weight:800;text-decoration:underline}

.alert-banner{display:flex;gap:.5rem;background:rgba(225,29,46,.08);border:1.5px solid rgba(225,29,46,.3);border-radius:12px;
  padding:.65rem .75rem;font-size:.78rem;color:var(--red-dark);font-weight:600;margin-bottom:1rem;display:none;align-items:flex-start}
.alert-banner.show{display:flex}
.alert-banner svg{width:16px;height:16px;stroke:var(--red-dark);flex-shrink:0;margin-top:.1rem}

.security-note{display:flex;gap:.5rem;background:rgba(18,86,214,.06);border:1.5px solid rgba(18,86,214,.18);border-radius:12px;
  padding:.65rem .75rem;font-size:.72rem;color:var(--ink-soft);line-height:1.5;margin-top:1.2rem}
.security-note svg{width:15px;height:15px;stroke:var(--blue);flex-shrink:0;margin-top:.1rem}

/* toast */
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:.7rem 1.1rem;border-radius:50px;font-size:.8rem;font-weight:700;z-index:300;box-shadow:0 10px 22px -8px rgba(0,0,0,.4);
  display:none}
.toast.show{display:block;animation:toastin .25s ease}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* language menu */
.lang-menu{position:relative}
.lang-list{position:absolute;right:0;top:calc(100% + 8px);background:#fff;color:var(--ink);border-radius:12px;
  box-shadow:0 14px 30px -12px rgba(0,0,0,.35);min-width:150px;display:none;overflow:hidden;z-index:60}
.lang-list.open{display:block}
.lang-list button{width:100%;text-align:left;padding:.65rem .9rem;background:none;border:none;font-size:.8rem;font-weight:600}
.lang-list button:hover,.lang-list button.active{background:rgba(225,29,46,.08);color:var(--red)}

@media (max-width:640px){
  .split-bg{flex-direction:column}
  .split-bg .half{flex:none;height:64px}
  .stage{padding:1.1rem .7rem 2.6rem}
}
</style>
</head>
<body>

<a class="skip-link" href="#loginCard" data-bn="মূল কনটেন্টে যান" data-en="Skip to login">Skip to login</a>

<div class="split-bg" aria-hidden="true"><div class="half pink"></div><div class="half yellow"></div></div>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">B</span>
      <span class="brand-word">BIYE <span data-bn="বিয়ে" data-en="">বিয়ে</span><small data-bn="বিবাহের বিজ্ঞান। জীবনভর বিশ্বাস।" data-en="Science of Marriage. Trust for Life.">Science of Marriage. Trust for Life.</small></span>
    </a>
    <div class="header-actions">
      <div class="lang-menu">
        <button class="hbtn icon-only" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="Language">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20 15 15 0 010-20z"/></svg>
        </button>
        <div class="lang-list" id="langList">
          <button data-lang="en">English</button>
          <button data-lang="bn">বাংলা</button>
          <button data-lang="hi">हिन्दी</button>
          <button data-lang="ar">العربية</button>
          <button data-lang="zh">中文</button>
        </div>
      </div>
      <a class="hbtn" href="register.html">
        <span class="btn-label" data-bn="নিবন্ধন" data-en="Register">Register</span>
      </a>
    </div>
  </div>
</header>

<main class="stage">
  <div class="card-wrap">
    <section class="login-card" id="loginCard" aria-live="polite">

      <div class="login-badge">🔐</div>
      <h1 class="login-title" data-bn="আবার স্বাগতম" data-en="Welcome back">Welcome back</h1>
      <p class="login-sub" data-bn="আপনার মোবাইল নম্বর ও পাসওয়ার্ড দিয়ে লগইন করুন।" data-en="Log in with your mobile number and password.">Log in with your mobile number and password.</p>

      <div class="alert-banner" id="loginAlert" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
        <span id="loginAlertText"></span>
      </div>

      <form id="loginForm" novalidate>
        <div class="field-row">
          <label class="field-label" for="phone" data-bn="মোবাইল নম্বর" data-en="Mobile number">Mobile number</label>
          <input class="field-input" id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX" oninput="clearErr('phone')">
          <div class="field-err" id="err-phone" data-bn="একটি বৈধ বাংলাদেশি মোবাইল নম্বর দিন" data-en="Enter a valid Bangladeshi mobile number">Enter a valid Bangladeshi mobile number</div>
        </div>

        <div class="field-row">
          <label class="field-label" for="password">
            <span data-bn="পাসওয়ার্ড" data-en="Password">Password</span>
            <button type="button" class="forgot-link" onclick="forgotPassword()" data-bn="পাসওয়ার্ড ভুলে গেছেন?" data-en="Forgot password?">Forgot password?</button>
          </label>
          <div class="pw-wrap">
            <input class="field-input" id="password" type="password" autocomplete="current-password" oninput="clearErr('password')">
            <button type="button" class="pw-toggle" onclick="togglePw()" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="field-err" id="err-password" data-bn="পাসওয়ার্ড দিন" data-en="Enter your password">Enter your password</div>
        </div>

        <div class="remember-row">
          <input type="checkbox" id="remember" checked>
          <label for="remember" data-bn="আমাকে মনে রাখুন" data-en="Remember me">Remember me</label>
        </div>

        <button class="btn btn-primary" id="loginBtn" type="submit">
          <span id="loginBtnLabel" data-bn="লগইন করুন" data-en="Log in">Log in</span>
        </button>
      </form>

      <div class="divider" data-bn="অথবা" data-en="or">or</div>
      <div class="alt-row">
        <span data-bn="অ্যাকাউন্ট নেই?" data-en="No account yet?">No account yet?</span>
        <a href="register.html" data-bn="নিবন্ধন করুন" data-en="Register">Register</a>
      </div>

      <div class="security-note">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span data-bn="BIYE কখনো আপনার পাসওয়ার্ড, OTP বা কার্ডের তথ্য চ্যাট/কলে চাইবে না।" data-en="BIYE will never ask for your password, OTP, or card details by chat or call.">BIYE will never ask for your password, OTP, or card details by chat or call.</span>
      </div>

    </section>
  </div>
</main>

<div class="toast" id="toast" role="status"></div>

<script src="supabase-client.js"></script>
<script>
function curLang(){ return document.documentElement.getAttribute('lang') || 'en'; }
function tt(bn, en){ return curLang() === 'bn' ? bn : en; }

var toastTimer;
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

function clearErr(id){
  var input = document.getElementById(id);
  var err = document.getElementById('err-' + id);
  if (input) input.classList.remove('err');
  if (err) err.classList.remove('show');
}
function setErr(id, show){
  var input = document.getElementById(id);
  var err = document.getElementById('err-' + id);
  if (input) input.classList.toggle('err', show);
  if (err) err.classList.toggle('show', show);
}

function validPhoneBD(v){
  var n = v.replace(/[^0-9]/g,'');
  return /^(01[3-9][0-9]{8}|8801[3-9][0-9]{8})$/.test(n);
}

function togglePw(){
  var f = document.getElementById('password');
  f.type = f.type === 'password' ? 'text' : 'password';
}

function showAlert(msg){
  document.getElementById('loginAlertText').textContent = msg;
  document.getElementById('loginAlert').classList.add('show');
}
function hideAlert(){
  document.getElementById('loginAlert').classList.remove('show');
}

function forgotPassword(){
  // Integration point: wire to a real password-reset flow (SMS/email OTP
  // via send-otp.js) once that backend endpoint exists. For now, guide
  // the user rather than pretending a reset was sent.
  showToast(tt('পাসওয়ার্ড রিসেটের জন্য সাপোর্টে যোগাযোগ করুন', 'Contact support to reset your password'));
}

function setBusy(busy){
  var btn = document.getElementById('loginBtn');
  var label = document.getElementById('loginBtnLabel');
  btn.disabled = busy;
  if (busy) {
    label.innerHTML = '<span class="spinner"></span>' + tt('লগইন হচ্ছে...', 'Logging in...');
  } else {
    label.textContent = tt('লগইন করুন', 'Log in');
  }
}

document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  hideAlert();

  var phone = document.getElementById('phone').value.trim();
  var password = document.getElementById('password').value;
  var ok = true;

  if (!validPhoneBD(phone)) { setErr('phone', true); ok = false; } else setErr('phone', false);
  if (!password) { setErr('password', true); ok = false; } else setErr('password', false);
  if (!ok) return;

  setBusy(true);
  try {
    var result = await BiyeDB.signInWithPassword(phone, password);
    if (result && result.error) {
      showAlert(result.error.message || tt('মোবাইল নম্বর বা পাসওয়ার্ড ভুল', 'Incorrect mobile number or password'));
      setBusy(false);
      return;
    }
    showToast(tt('সফলভাবে লগইন হয়েছে', 'Logged in successfully'));
    location.href = 'dashboard.html';
  } catch (err) {
    showAlert(tt('সংযোগ করা যায়নি। আবার চেষ্টা করুন।', "Couldn't connect. Please try again."));
    setBusy(false);
  }
});

(function(){
  var state = { lang: null };
  function detectLang(){
    if (state.lang) return state.lang;
    var langs = navigator.languages || [navigator.language || ''];
    for (var i = 0; i < langs.length; i++) { if (String(langs[i]).toLowerCase().indexOf('bn') === 0) return 'bn'; }
    return 'en';
  }
  window.applyLang = function(lang){
    state.lang = lang;
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    document.querySelectorAll('[data-bn]').forEach(function(el){
      var attr = lang === 'bn' ? 'data-bn' : (lang === 'en' ? 'data-en' : null);
      var text = attr ? el.getAttribute(attr) : el.getAttribute('data-en');
      if (text !== null && text !== '') { el.textContent = text; }
    });
    document.querySelectorAll('#langList button').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-lang') === lang);
    });
    localStorage.setItem('biye_lang_pref', lang);
  };
  document.addEventListener('DOMContentLoaded', function(){
    var saved = localStorage.getItem('biye_lang_pref');
    applyLang(saved || detectLang());
    document.getElementById('langBtn').addEventListener('click', function(){
      var list = document.getElementById('langList');
      var open = list.classList.toggle('open');
      this.setAttribute('aria-expanded', open);
    });
    document.querySelectorAll('#langList button').forEach(function(b){
      b.addEventListener('click', function(){
        applyLang(this.getAttribute('data-lang'));
        document.getElementById('langList').classList.remove('open');
      });
    });
    document.addEventListener('click', function(e){
      if (!e.target.closest('.lang-menu')) document.getElementById('langList').classList.remove('open');
    });
  });
})();
</script>
</body>
</html>
